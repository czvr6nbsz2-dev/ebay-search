name: Wekelijks Nikkor 35mm f1.4 (particulieren en winkels)

# Draait elke maandag 07:00 UTC (09:00 in Nederland).
# GitHub voert geplande workflows alleen uit vanaf de standaardbranch (main),
# vandaar dat dit bestand hier staat. De code zelf komt van de feature-branch.

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zoek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nikon-fe2-price-comparison-CHETT

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installeer dependencies
        run: pip install -r requirements.txt

      - name: Zoek Nikkor 35mm f1.4 AI
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          CI: true
          SPEC: "Nikkor 35mm f1.4 AI - wekelijks || nikkor 35mm 1.4, nikkor 35mm 1:1.4, nikon 35mm 1.4 ai, nikkor 35mm f1.4 ais, nikon fm2 35mm 1.4, nikon fe2 35mm 1.4, nikon 35mm 1.4 weitwinkel || 35mm, 35 mm, /35 || 24mm, 28mm, 50mm, 55mm, 58mm, 85mm, 105mm, 135mm, 180mm, 200mm, 20mm, 18mm, 45mm, 5cm, 5.8cm, 3.5cm, 50, 55, 58, rangefinder, eye level, nikkor-s, s.c, s auto, 24-70, 35-70, 35-105, 28-105, 28-85, 35-80, 70-300, zoom, f/2, f2, 1:2, 2.0, 2,0, f/2.8, f2.8, 1:2.8, 2.8, 2,8, f/1.8, 1:1.8, 1.8, f/3.5, 1:3.5, 3.5, af-s, afs, af-d, 1.4g, g ed, nano, nikon z, nikkor z, z-mount, z mount, voigtlander, nokton, thypoch, simera, zeiss, distagon, ttartisan, ttartisans, canon, sony, sigma, tamron, minolta, pentax, olympus, leica, contax, konica, m42, fujifilm, samyang, viltrox, 7artisans, mir, helios, jupiter, filter, hood, gegenlicht, sonnenblende, deckel, cap, tasche, huelle, case, adapter, akku, batter, boek, book, buch, anleitung, prospekt, katalog, gezocht, gesucht, defect, defekt, parts, spares, broken, kaputt, repair, junk, fungus, schimmel, pilz, haze, nebel, dunst, kratzer, scratch || 35mm | 35 mm | /35 ; 1.4 | 1:1.4 | f/1.4 | f1.4 | 1,4"
        run: python raw_search.py "$SPEC"
