name: Zoek fotografiemateriaal

on:
  workflow_dispatch:
    inputs:
      description:
        description: 'Beschrijving van wat je zoekt'
        required: true
        type: string

jobs:
  search:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Op deze branch draait de AI-loze variant: geen OPENAI_API_KEY nodig.
      # Input-formaat: "label || zoektermen || include-termen || exclude-termen"
      - name: Run raw search
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          CI: true
        run: python raw_search.py "${{ github.event.inputs.description }}"
